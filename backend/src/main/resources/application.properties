spring.application.name=spendlens-backend

# Server
server.port=${PORT:8081}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/spendlens}
spring.datasource.username=${DATABASE_USERNAME:spendlens}
spring.datasource.password=${DATABASE_PASSWORD:spendlens}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Frontend (CORS + OAuth redirects)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# JWT
app.jwt.secret=${JWT_SECRET:spendlens-super-secret-key-change-this-later}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google Gmail OAuth (set via env in production; use application-local.properties for local dev)
google.gmail.client-id=${GOOGLE_GMAIL_CLIENT_ID:}
google.gmail.client-secret=${GOOGLE_GMAIL_CLIENT_SECRET:}
google.gmail.redirect-uri=${GOOGLE_GMAIL_REDIRECT_URI:http://localhost:8081/api/auth/gmail/callback}
google.gmail.scopes=${GOOGLE_GMAIL_SCOPES:https://www.googleapis.com/auth/gmail.readonly}

# FX rates for Gmail receipt conversion (approximate; override in production)
app.fx.usd-to-cop=${USD_TO_COP:4000}
app.fx.cad-to-cop=${CAD_TO_COP:3000}
app.fx.eur-to-cop=${EUR_TO_COP:4300}
app.fx.gbp-to-cop=${GBP_TO_COP:5000}

# Public app URL for password reset links
app.public-url=${APP_PUBLIC_URL:${FRONTEND_URL:http://localhost:5173}}
